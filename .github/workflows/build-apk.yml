name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"

          JAVA_VERSION_LINE=$(java -version 2>&1 | head -n 1 || true)
          RAW_VERSION=$(printf '%s\n' "$JAVA_VERSION_LINE" | sed -nE 's/.*version "([^"]+)".*/\1/p')
          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Failed to detect the active Java version."
            exit 1
          fi

          if [[ "$RAW_VERSION" == 1.* ]]; then
            JAVA_MAJOR=$(printf '%s\n' "$RAW_VERSION" | cut -d'.' -f2)
          else
            JAVA_MAJOR=$(printf '%s\n' "$RAW_VERSION" | cut -d'.' -f1 | sed -E 's/[^0-9].*$//')
          fi

          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "::error::Failed to parse the active Java major version from '${RAW_VERSION}'."
            exit 1
          fi

          echo "Detected Java major version: ${JAVA_MAJOR}"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java ${JAVA_MAJOR}."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore or create debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "./debug.keystore" ]; then
            echo "Debug keystore already exists at ./debug.keystore; using existing keystore."
          elif [ -f "./debug.keystore.base64" ]; then
            if ! tr -d '\r\n ' < ./debug.keystore.base64 | base64 -d > ./debug.keystore; then
              rm -f ./debug.keystore
              echo "::error::Failed to decode ./debug.keystore.base64 into ./debug.keystore."
              exit 1
            fi
            echo "Restored consistent debug keystore from ./debug.keystore.base64."
          else
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              echo "::error::keytool executable was not found under configured Java 17 JAVA_HOME."
              exit 1
            fi

            if ! "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1; then
              echo "::error::Failed to generate temporary ./debug.keystore."
              exit 1
            fi
          fi

          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "::error::Debug keystore ./debug.keystore is missing or empty."
            exit 1
          fi

          KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
          if [ -x "$KEYTOOL_BIN" ]; then
            "$KEYTOOL_BIN" -list -v -keystore ./debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA256:|Valid from:" || true
          fi
          echo "Verified ./debug.keystore exists and is readable."

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at ${EXPECTED_APK}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK files discovered inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::${EXPECTED_APK} is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::${EXPECTED_APK} is empty."
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::${EXPECTED_APK} does not have the .apk extension."
            exit 1
          fi

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::Selected APK path does not match app/build/outputs/apk/debug/app-debug.apk."
            exit 1
          fi

          echo "Verified debug APK: ${EXPECTED_APK}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Verified debug APK is missing or empty at ${SOURCE_APK}."
            exit 1
          fi

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME=$(printf '%s' "$RAW_REPO_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^[.-]+//; s/[.-]+$//')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          RELEASE_ASSET_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-asset-XXXXXX")
          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${RELEASE_ASSET_DIR}/${ASSET_FILENAME}"

          cp "$SOURCE_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Failed to prepare a valid non-empty .apk release asset."
            exit 1
          fi

          {
            echo "asset_path=${ASSET_PATH}"
            echo "asset_filename=${ASSET_FILENAME}"
          } >> "$GITHUB_OUTPUT"

          echo "Prepared release asset filename: ${ASSET_FILENAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
          ASSET_FILENAME: ${{ steps.prepare_release_asset.outputs.asset_filename }}
        run: |
          set -euo pipefail

          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is not available. Skipping GitHub Release creation."
            exit 1
          fi
          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::warning::Prepared release asset is missing, empty, or not a valid .apk file. Skipping GitHub Release creation."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES=$(cat <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - **GitHub Actions Run Number:** ${GITHUB_RUN_NUMBER}
          - **GitHub Actions Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}

          **Notes:**
          - This APK is intended for testing only.
          - This APK is not a Play Store production release.
          - This APK is signed only with a temporary debug keystore.
          EOF
          )

          if ! gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest; then
            echo "::warning::Failed to publish GitHub Release '${RELEASE_TAG}'. The debug APK build and Actions artifact 'app-debug-apk' remain available."
            exit 1
          fi

      - name: Report APK download result
        if: ${{ always() && steps.publish_release.outcome != 'skipped' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          ASSET_FILENAME: ${{ steps.prepare_release_asset.outputs.asset_filename }}
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            if RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq '.url' 2>/dev/null) && [ -n "$RELEASE_URL" ]; then
              gh release view "$RELEASE_TAG" >/dev/null
              echo "GitHub Release published successfully."
              echo "Release tag: ${RELEASE_TAG}"
              echo "Release title: ${RELEASE_TITLE}"
              echo "Release URL: ${RELEASE_URL}"
              echo "APK asset filename: ${ASSET_FILENAME}"
              {
                echo "## Debug APK Download"
                echo ""
                echo "The debug APK build, GitHub Actions artifact upload, and GitHub Release publishing all succeeded."
                echo ""
                echo "- **Release tag:** \`${RELEASE_TAG}\`"
                echo "- **Release title:** ${RELEASE_TITLE}"
                echo "- **APK asset filename:** \`${ASSET_FILENAME}\`"
                echo "- **Direct GitHub Release URL:** ${RELEASE_URL}"
                echo ""
                echo "Download the APK directly from the **Assets** section on the GitHub Release page above."
                echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available on this workflow run as a backup."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            else
              echo "::warning::Release publishing step succeeded, but confirming the release with 'gh release view' failed."
              PUBLISH_OUTCOME="failure"
            fi
          fi

          echo "::warning::GitHub Release publishing failed. The debug APK build succeeded and the GitHub Actions artifact 'app-debug-apk' remains available."
          {
            echo "## Debug APK Download (Release Publishing Warning)"
            echo ""
            echo "> **Warning:** GitHub Release publishing did not succeed for this run."
            echo ""
            echo "- **APK build status:** Succeeded"
            echo "- **Backup Actions artifact:** \`app-debug-apk\` (available under this workflow run's **Artifacts** section)"
            echo ""
            echo "You can download the debug APK from the \`app-debug-apk\` artifact on this GitHub Actions run."
          } >> "$GITHUB_STEP_SUMMARY"
